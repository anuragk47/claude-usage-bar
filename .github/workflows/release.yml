# Builds the .dmg on GitHub's Macs and attaches it to a GitHub Release.
#
# To publish a release, either:
#   - on GitHub: Releases → Draft a new release → new tag like v1.0.0 → Publish release, or
#   - from git:  git tag v1.0.0 && git push origin v1.0.0
# The .dmg is built on GitHub's Macs and attached to that release a few minutes later.
# Running it by hand from the Actions tab only keeps the .dmg as a build artifact.
name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

# Publishing a release on GitHub can fire both triggers; run them one after another.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .dmg
        run: scripts/make-dmg.sh "${GITHUB_REF_NAME}"

      - name: Keep the .dmg as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-dmg
          path: dist/*.dmg

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: ${{ github.ref_name }}
          generate_release_notes: ${{ github.event_name != 'release' }}
          body: |
            **Download `ClaudeUsage.dmg` below**, open it and drag Claude Usage to Applications.

            The first time you open it, macOS will say it can't verify the app. Go to
            **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            You only need to do this once. Full guide: [README](https://github.com/${{ github.repository }}#readme)
